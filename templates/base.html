<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.page_title }}{% endblock %}</title>
  <meta name="description" content="{{ t.meta_description }}">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("fk-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='7' fill='%23c4553b'/%3E%3Cline x1='5' y1='12.5' x2='27' y2='12.5' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='css/landing.css') }}">
  <script id="i18n" type="application/json">{{ js_json|safe }}</script>
  <script src="{{ url_for('static', path='js/effects.js') }}" defer></script>
</head>
<body>
  <div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>

  <header class="nav">
    <div class="container nav__inner">
      <a class="nav__brand" href="/" aria-label="{{ t.aria_logo_home }}">
        <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect x="5" y="2" width="22" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="5" y1="12.5" x2="27" y2="12.5" stroke="currentColor" stroke-width="2"/>
          <rect x="22.5" y="6" width="2.4" height="4" rx="1.2" fill="currentColor"/>
          <rect x="22.5" y="16" width="2.4" height="6" rx="1.2" fill="currentColor"/>
        </svg>
        <span>{{ t.brand }}</span>
      </a>
      <nav class="nav__links" aria-label="Main">
        <a href="#problems">{{ t.problems_eyebrow }}</a>
        <a href="#steps">{{ t.steps_eyebrow }}</a>
        <a href="#reviews">{{ t.reviews_eyebrow }}</a>
        <a href="#faq">{{ t.faq_eyebrow }}</a>
      </nav>
      <div class="nav__actions">
        <a class="lang-switch" href="{{ request.url.include_query_params(lang=other_lang) }}" hreflang="{{ other_lang }}">{{ t.lang_switch }}</a>
        <a class="btn btn--primary btn--small" href="{{ app_url }}"><span>{{ t.nav_open }}</span></a>
        <button class="theme-toggle" type="button" aria-label="{{ t.theme_label }}" title="{{ t.theme_label }}">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container footer__inner">
      <span>{{ t.footer_tagline }}</span>
      <a class="lang-switch" href="{{ request.url.include_query_params(lang=other_lang) }}" hreflang="{{ other_lang }}">{{ t.lang_switch }}</a>
    </div>
  </footer>
</body>
</html>
