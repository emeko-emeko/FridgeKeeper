<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.page_title }}</title>
  <meta name="description" content="{{ t.meta_description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='7' fill='%23b5452f'/%3E%3Cline x1='5' y1='12.5' x2='27' y2='12.5' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='css/landing.css') }}">
  <script id="i18n" type="application/json">{{ js_json|safe }}</script>
  <script src="{{ url_for('static', path='js/effects.js') }}" defer></script>
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a class="nav__brand" href="/" aria-label="{{ t.aria_logo_home }}">
        <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect x="5" y="2" width="22" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="5" y1="12.5" x2="27" y2="12.5" stroke="currentColor" stroke-width="2"/>
          <rect x="22.5" y="6" width="2.4" height="4" rx="1.2" fill="currentColor"/>
          <rect x="22.5" y="16" width="2.4" height="6" rx="1.2" fill="currentColor"/>
        </svg>
        <span>{{ t.brand }}</span>
      </a>
      <div class="nav__actions">
        <a class="lang-switch" href="{{ request.url.include_query_params(lang=other_lang) }}" hreflang="{{ other_lang }}">{{ t.lang_switch }}</a>
        <a class="btn btn--primary btn--small" href="{{ app_url }}">{{ t.nav_open }}</a>
        <button class="theme-toggle" type="button" aria-label="Тема">◐</button>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container footer__inner">
      <span>{{ t.footer_tagline }}</span>
      <a class="lang-switch" href="{{ request.url.include_query_params(lang=other_lang) }}" hreflang="{{ other_lang }}">{{ t.lang_switch }}</a>
    </div>
  </footer>
</body>
</html>
