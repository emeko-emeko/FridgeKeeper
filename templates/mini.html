<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FridgeKeeper</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Цвета берём из темы Telegram; запасные значения — для открытия не в Telegram. */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1f1f1f);
      --hint: var(--tg-theme-hint-color, #6b6b6b);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f4);
      --btn: var(--tg-theme-button-color, #b84b34);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: var(--tg-theme-destructive-text-color, #c62828);
      --radius: 16px;
      color-scheme: light dark;
    }
    :focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
    }
    h1 { font-size: 22px; font-weight: 500; margin: 4px 0 4px; }
    h2 { font-size: 17px; font-weight: 500; margin: 0 0 8px; }
    .hidden { display: none !important; }
    .subtitle { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
    .status { color: var(--hint); font-size: 14px; min-height: 20px; margin: 0 0 12px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .muted { color: var(--hint); font-size: 14px; margin: 0 0 12px; }

    .btn {
      display: block;
      width: 100%;
      font: inherit;
      font-weight: 500;
      min-height: 48px;
      padding: 12px;
      margin-top: 12px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      cursor: pointer;
    }
    .btn-primary { background: var(--btn); color: var(--btn-text); border: none; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: var(--hint);
    }
    input[type=text], input[type=date] {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      border-radius: 10px;
    }

    .suggest-hint { color: var(--hint); font-size: 14px; margin: 12px 0 0; }
    .warn {
      color: var(--danger);
      font-weight: 500;
      margin: 12px 0 0;
    }
    .saved {
      color: var(--text);
      font-weight: 500;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>FridgeKeeper</h1>
  <p class="subtitle">Контроль сроков годности</p>
  <p id="status" class="status">Входим…</p>

  <section id="camera" class="hidden">
    <div class="card">
      <h2>Добавить продукт по фото</h2>
      <p class="muted">Фото не сохраняется: оно читается и сразу отбрасывается.</p>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
      <button id="snap" class="btn btn-primary" type="button">Сфотографировать</button>
      <p id="scanStatus" class="muted"></p>
    </div>

    <div id="result" class="card hidden">
      <h2>Проверьте данные</h2>
      <label>Название
        <input id="name" type="text" maxlength="100">
      </label>
      <label>Годен до
        <input id="expiry" type="date">
      </label>
      <p id="expiredWarn" class="warn hidden">Срок уже истёк</p>
      <p id="hint" class="suggest-hint"></p>
      <button id="yes" class="btn btn-primary" type="button">Да, сохранить</button>
      <button id="no" class="btn" type="button">Нет, введу сам</button>
    </div>
  </section>

  <script>
    const status = document.getElementById("status");
    const tg = window.Telegram && window.Telegram.WebApp;
    // Токен храним только в памяти страницы, не в localStorage.
    let token = null;

    const camera = document.getElementById("camera");
    const photo = document.getElementById("photo");
    const snap = document.getElementById("snap");
    const scanStatus = document.getElementById("scanStatus");
    const result = document.getElementById("result");
    const nameInput = document.getElementById("name");
    const expiryInput = document.getElementById("expiry");
    const expiredWarn = document.getElementById("expiredWarn");
    const hint = document.getElementById("hint");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    // Предложение от распознавания; по нему решаем, источник «ocr» или «manual».
    let suggested = { name: "", expiry: null };

    function authHeaders() {
      return { Authorization: "Bearer " + token };
    }

    function resetScan() {
      result.classList.add("hidden");
      expiredWarn.classList.add("hidden");
      hint.textContent = "";
      nameInput.value = "";
      expiryInput.value = "";
      suggested = { name: "", expiry: null };
      photo.value = "";
    }

    async function login() {
      if (!tg || !tg.initData) {
        status.textContent = "Откройте эту страницу из Telegram.";
        return;
      }
      tg.ready();
      tg.expand();

      const r = await fetch("/auth/mini-app", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ init_data: tg.initData }),
      });
      if (!r.ok) {
        status.textContent = "Не удалось войти: " + r.status;
        return;
      }
      token = (await r.json()).token;

      const me = await fetch("/auth/me", { headers: authHeaders() });
      if (!me.ok) {
        status.textContent = "Ошибка проверки: " + me.status;
        return;
      }
      status.textContent = "";
      camera.classList.remove("hidden");
    }

    snap.addEventListener("click", () => photo.click());

    photo.addEventListener("change", async () => {
      const file = photo.files && photo.files[0];
      if (!file) return;
      resetScan();
      scanStatus.textContent = "Распознаём…";
      snap.disabled = true;

      // Уменьшаем фото в браузере: Vercel не принимает тела больше ~4,5 МБ (413).
      async function shrink(f) {
        try {
          const bmp = await createImageBitmap(f);
          const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(bmp.width * scale);
          canvas.height = Math.round(bmp.height * scale);
          canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.8));
          return blob || f;
        } catch (e) {
          return f;
        }
      }

      try {
        const form = new FormData();
        form.append("file", await shrink(file), "label.jpg");
        const r = await fetch("/products/scan", {
          method: "POST",
          headers: authHeaders(),
          body: form,
        });
        if (r.status === 413) {
          scanStatus.textContent = "Фото слишком большое, попробуйте ещё раз.";
          return;
        }
        if (!r.ok) {
          scanStatus.textContent = "Не удалось распознать: " + r.status;
          return;
        }
        const data = await r.json();
        suggested = { name: data.product_name || "", expiry: data.expiry_date };
        nameInput.value = suggested.name;
        expiryInput.value = suggested.expiry || "";
        expiredWarn.classList.toggle("hidden", !data.expired);
        hint.textContent = suggested.name
          ? "Проверьте название и дату, затем подтвердите."
          : "Название не распознано, введите его сами.";
        result.classList.remove("hidden");
        scanStatus.textContent = "";
      } catch (err) {
        scanStatus.textContent = "Ошибка сети: " + err.message;
      } finally {
        snap.disabled = false;
      }
    });

    async function save(name, expiry, source) {
      const r = await fetch("/products", {
        method: "POST",
        headers: { ...authHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          expiry_date: expiry || null,
          expiry_source: source,
        }),
      });
      if (r.status === 201) {
        resetScan();
        scanStatus.textContent = "";
        status.textContent = "Сохранено: " + name;
        status.className = "saved";
      } else {
        scanStatus.textContent = "Не сохранено: " + r.status;
      }
    }

    yesBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) {
        hint.textContent = "Введите название.";
        return;
      }
      // Источник «ocr», только если пользователь не менял предложенные значения.
      const unchanged = name === suggested.name && (expiryInput.value || null) === suggested.expiry;
      save(name, expiryInput.value, unchanged ? "ocr" : "manual");
    });

    noBtn.addEventListener("click", () => {
      // «Нет» — очищаем предложение, пользователь вводит сам.
      nameInput.value = "";
      expiryInput.value = "";
      expiredWarn.classList.add("hidden");
      hint.textContent = "Введите название и дату вручную.";
      suggested = { name: "", expiry: null };
      nameInput.focus();
    });

    login();
  </script>
</body>
</html>
