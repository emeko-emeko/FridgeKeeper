{% extends "base.html" %}

{% block content %}
<main class="section placeholder">
  <div class="container narrow">
    <h1 class="section__title">{{ t.app_title }}</h1>
    <p class="section__lead">{{ t.app_text }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="/">{{ t.app_back }}</a>
      <a class="btn btn--ghost" href="{{ bot_url }}" target="_blank" rel="noopener">{{ t.app_bot }}</a>
    </div>
  </div>
</main>
{% endblock %}
