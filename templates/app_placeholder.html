{% extends "base.html" %}

{% block content %}
<main class="placeholder canvas-dark">
  <div class="container placeholder__inner">
    <h1 class="placeholder__title">{{ t.app_title }}</h1>
    <p class="hero__sub">{{ t.app_text }}</p>
    <div class="hero__actions">
      <a class="btn btn--inverted" href="/">{{ t.app_back }}</a>
      <a class="btn btn--ghost" href="{{ bot_url }}" target="_blank" rel="noopener">{{ t.app_bot }}</a>
    </div>
  </div>
</main>
{% endblock %}
